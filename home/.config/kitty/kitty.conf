# ─── Kitty Modern — enak dipakai lama ─────────────────────────────
# Laptop 1080p + Hyprland + fish + starship
# Backup lama: kitty.conf.bak-20260924 / colors.conf.bak-20260924
# Reload cepat: Ctrl+Shift+F5  |  Font +/- : Ctrl+Shift+= / Ctrl+Shift+-

# Tema: Tokyo Night (kontras lembut, mata gak cepat capek)
include ~/.config/kitty/themes/tokyo-night.conf
foreground              #9ece6a

# ─── Font: jernih & lega ──────────────────────────────────────────
font_family                 JetBrainsMono Nerd Font Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   12.5

# Napas baris lega, underline link modern
adjust_line_height          3
adjust_column_width         0
modify_font                 underline_position +2
modify_font                 underline_thickness 150%

# Emoji tetap kebaca (kalau Noto Emoji kepasang, dipakai otomatis)
symbol_map U+1F300-U+1FAFF,U+2600-U+27BF,U+2B00-U+2BFF Noto Color Emoji

# ─── Kursor: modern, kalem ────────────────────────────────────────
cursor_shape                beam
cursor_beam_thickness       1.5
cursor_underline_thickness  2.0
cursor_blink_interval       0.6
cursor_stop_blinking_after  15.0
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 2

# ─── Jendela: bersih ala tiling ───────────────────────────────────
window_padding_width        10
window_margin_width         0
single_window_margin_width  -1
window_border_width         1px
inactive_text_alpha         0.9
hide_window_decorations     yes
confirm_os_window_close     -1
remember_window_size        no
initial_window_width        120c
initial_window_height       32c
enabled_layouts             tall:bias=50;full_size=1;mirrored=false,stack,grid,splits
window_resize_step_cells    2
window_resize_step_lines    2

# Transparan + blur frosted (blur-nya dikerjain Hyprland, yang ini udah nyala).
# 0.3 = wallpaper dominan, teks tetap kebaca. Solid sementara: Ctrl+Shift+A lalu 1
background_opacity          0.93
background_blur             32
dynamic_background_opacity  yes

# ─── Tab bar: powerline minimal ───────────────────────────────────
tab_bar_edge                top
tab_bar_margin_width        4.0
tab_bar_margin_height       4.0 0.0
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_align               left
tab_bar_min_tabs            2
tab_switch_strategy         previous
active_tab_font_style       bold
inactive_tab_font_style     normal
tab_title_max_length        24
tab_title_template          "{index}: {title}"

# ─── Scroll & mouse: betah scroll lama ────────────────────────────
scrollback_lines            10000
scrollback_pager            less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier     3.0
wheel_scroll_min_lines      1
touch_scroll_multiplier     1.0
mouse_hide_wait             2.0
focus_follows_mouse         no
copy_on_select              yes
strip_trailing_spaces       smart
select_by_word_characters   @-./_~?&=%+#
click_interval              0.5

# Link: garis curly, klik + hint keyboard
url_style                   curly
detect_urls                 yes
open_url_with               default
url_prefixes                http https file ftp gemini irc ircs kitty ssh

# ─── Bel: visual aja, gak berisik ─────────────────────────────────
enable_audio_bell           no
visual_bell_duration        0.2
window_alert_on_bell        yes
bell_on_tab                 yes

# ─── Performa: halus, hemat baterai ───────────────────────────────
repaint_delay               8
input_delay                 1
sync_to_monitor             yes

# ─── Integrasi shell & remote ─────────────────────────────────────
shell_integration           enabled
editor                      nvim
term                        xterm-kitty
allow_remote_control        yes
listen_on                   unix:/tmp/kitty
clipboard_control           write-clipboard write-primary

# ─── Shortcut modern ──────────────────────────────────────────────
# Tab & window
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+w close_window
map kitty_mod+enter new_window
map kitty_mod+n new_os_window
map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

# Split ala vim + resize + fokus (mode baca lega)
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+r start_resizing_window
map kitty_mod+z toggle_layout stack

# Copy / paste / hints / scrollback
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection
map shift+insert paste_from_selection
map kitty_mod+e open_url_with_hints
map kitty_mod+o show_scrollback
map kitty_mod+shift+k clear_terminal reset active

# Font & opacity & reload (buat nemu setting paling pas)
map kitty_mod+equal increase_font_size
map kitty_mod+minus decrease_font_size
map kitty_mod+0 restore_font_size
map kitty_mod+a>m set_background_opacity +0.1
map kitty_mod+a>l set_background_opacity -0.1
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default
map kitty_mod+f5 load_config_file
map kitty_mod+f toggle_fullscreen
