config_version = 14

[accessibility]
ui_scale = 1.0000000074505806

[bar.default]
background_opacity = 0.0
border_width = 0.0
capsule = false
capsule_padding = 10.0
capsule_radius = 15
capsule_thickness = 0.85999999999999999
center = [ "group:island" ]
compositor_blur = false
concave_edge_corners = false
contact_shadow = false
end = [ "group:stats", "group:status" ]
hover_highlight = true
margin_edge = 6
margin_ends = 10
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "group:left" ]
thickness = 36
widget_spacing = 8

    [[bar.default.capsule_group]]
    border = ""
    fill = "#000000"
    id = "left"
    members = [ "dracarys/spotlight:bar", "workspaces" ]
    opacity = 0.92000000000000004
    padding = 12.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "#000000"
    id = "island"
    members = [ "island_clock", "media", "island_viz" ]
    opacity = 1.0
    padding = 16.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border = ""
    fill = "#000000"
    id = "stats"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.92000000000000004
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "#000000"
    id = "status"
    members = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "dracarys/uptime:bar",
        "battery",
        "control-center",
        "session"
    ]
    opacity = 0.92000000000000004
    padding = 12.0

[dock]
active_scale = 1.0
auto_hide = false
background_opacity = 0.55000000000000004
border = "#ffffff"
border_width = 0.0
concave_edge_corners = false
cross_axis_padding = 8
enabled = true
icon_size = 46
inactive_opacity = 1.0
inactive_scale = 1.0
item_spacing = 8
launcher_icon = "grid-dots"
launcher_position = "none"
magnification = true
magnification_scale = 1.6000000000000001
main_axis_padding = 10
margin_edge = 8
pinned = [ "rice-launchpad", "brave-browser", "kitty", "org.telegram.desktop", "yazi", "dev.zed.Zed", "code-oss", "obsidian", "spotify" ]
position = "bottom"
radius = 22
reserve_space = false
shadow = true
show_dots = true
show_instance_count = false
show_running = true
smart_auto_hide = true

[hot_corners]
delay_ms = 300
enabled = true

    [hot_corners.bottom_left]
    action = "command"
    command = "sh -c '$HOME/.local/bin/spotlight-send toggle || noctalia msg panel-toggle launcher'"

    [hot_corners.bottom_right]
    action = "command"
    command = "noctalia msg session lock"

    [hot_corners.top_right]
    action = "command"
    command = "noctalia msg panel-toggle control-center"

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.34999999999999998
tint_intensity = 0.25

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
