[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 3800

[plugins]
enabled = [ "dracarys/spotlight", "dracarys/uptime" ]

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = true
    kind = "path"
    location = "@HOME@/.local/share/noctalia-plugins"
    name = "local"

[shell]
font_family = "Inter"
panel_anchor_bar = "default"

    [shell.launcher]
    categories = false
    compact = true
    show_app_origin_indicator = false

    [shell.panel]
    clipboard_placement = "attached"
    floating_offset = 170
    launcher_position = "top_center"
    polkit_position = "auto"
    transparency_mode = "glass"

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "@HOME@/Pictures/Screenshots"
    freeze_screen = true
    save_to_file = true
    skip_annotate_on_copy_save = true

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Eldritch"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty" ]

[wallpaper]
directory = "@HOME@/Pictures/Wallpapers"

    [wallpaper.default]
    path = "@HOME@/Pictures/Wallpapers/macos-mesh-aurora.png"

    [wallpaper.last]
    path = "@HOME@/Pictures/Wallpapers/macos-mesh-aurora.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "@HOME@/Pictures/Wallpapers/macos-mesh-aurora.png"

    [wallpaper.monitors.eDP-1]
    path = "@HOME@/Pictures/Wallpapers/macos-mesh-aurora.png"

[widget.island_clock]
color = "on_surface"
format = "{:%a %d %b  %H:%M}"
type = "clock"

[widget.island_viz]
bands = 12
show_when_idle = false
type = "audio_visualizer"
width = 40

[widget.launcher]
color = "on_surface"

[widget.media]
art_size = 18.0
hide_when_no_media = true
max_length = 240.0
title_scroll = "always"

[widget.network]
color = "on_surface"
show_label = false

[widget.notifications]
color = "on_surface"

[widget.session]
color = "on_surface"

[widget.tray]
capsule = false

[widget.volume]
color = "on_surface"

[widget.workspaces]
capsule = false